site_name: colgov
site_description: Deterministic, reversible tokenization and fail-closed access policy for tabular PII.
site_url: https://chowkuanlaw.github.io/colgov/
repo_url: https://github.com/chowkuanlaw/colgov
edit_uri: ""

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  features:
    - content.code.copy
    - navigation.sections
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: Light mode}

nav:
  - Overview: index.md
  - Threat model: threat-model.md
  - API stability: stability.md
  - Performance: performance.md
  - API reference: api.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - tables
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            members_order: source
            docstring_style: sphinx
            filters: ["!^_"]
